# Describes the Xcode project. The online build turns this into a real project,
# so you never need to open Xcode yourself.
name: KittyPlay
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  KittyPlay:
    type: application
    platform: iOS
    sources:
      - KittyPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kittyplay.toddlergame
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Kitty Play"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

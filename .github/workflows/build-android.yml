name: Build and test Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare the signing key
        env:
          KEY_BASE64: ${{ secrets.KITTYPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kittyplay.p12"
            echo "KITTYPLAY_KEYSTORE=$RUNNER_TEMP/kittyplay.p12" >> "$GITHUB_ENV"
          else
            echo "No signing key set, so this build uses a throwaway debug key."
          fi

      - name: Compile the app
        working-directory: android
        env:
          KITTYPLAY_KEY_PASSWORD: ${{ secrets.KITTYPLAY_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the app file
        run: cp android/app/build/outputs/apk/release/app-release.apk KittyPlay.apk

      - name: Save the app for download
        uses: actions/upload-artifact@v4
        with:
          name: KittyPlay-android
          path: KittyPlay.apk
          if-no-files-found: error

      - name: Allow the emulator to run fast
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 android/ci/smoke_test.py KittyPlay.apk screenshots

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: screenshots
          if-no-files-found: warn
